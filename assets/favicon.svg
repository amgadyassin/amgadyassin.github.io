<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e141d" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glass Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.65" />

  <!-- Letter A (Vector Path - Precision Spacing) -->
  <path d="M 9.5 43.5 L 17 20 L 24.5 43.5 M 12.5 35 L 21.5 35" 
        stroke="#ffffff" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Central Data Node / Connector Dot -->
  <circle cx="32" cy="33.5" r="2.8" fill="#10b981" filter="url(#glow)" />

  <!-- Letter Y (Vector Path - Precision Spacing) -->
  <path d="M 39.5 20 L 47 32 L 54.5 20 M 47 32 L 47 43.5" 
        stroke="url(#emeraldGrad)" 
        stroke-width="3.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
